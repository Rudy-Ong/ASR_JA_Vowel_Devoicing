[project]
name = "asr-ja-vowel-devoicing"
version = "1.0.0"
description = "Japanese ASR with explicit vowel-devoicing tokens (phone3): Conformer encoder + Transformer decoder trained on JSUT basic5000"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "RudyO" }]
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.3",
    "torchaudio>=2.3",
    "tqdm",
    "gradio>=4.0",
    "plotly",
    "matplotlib",
    "wandb",
    "libtmux",
]

[tool.uv]
package = false
